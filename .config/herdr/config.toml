onboarding = false

[theme]
# same theme family as tmux (catppuccin)
name = "catppuccin"

# let the terminal background (translucent alacritty) show through
[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
# stronger row highlights, so the active/selected workspace stands out on the translucent background
active_row_bg = "#45475a"
selection_bg = "#585b70"

[keys]
# same prefix as tmux (see .config/tmux/tmux.conf)
prefix = ";"

# split panes with h and v, as in tmux
# (tmux "split-window -h" = side by side = herdr "split_vertical")
split_vertical = "prefix+h"
split_horizontal = "prefix+v"

# zoom without prefix, as tmux "bind -n C-z resize-pane -Z"
zoom = "ctrl+z"

# switch panes with Alt-arrow without prefix
# (ctrl+hjkl also switch panes, through the vim-navigator plugin below)
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"

# rename the tab (tmux window) with prefix+, as in tmux
rename_tab = "prefix+comma"

# reload config with prefix+r, as in tmux; resize mode takes the old reload key
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# go to the previously used tab with prefix+l, as tmux last-window
# (needs the plugin in .config/herdr/plugins/last-tab, linked with `herdr plugin link`)
[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "tomas.last-tab.last-tab"
description = "last tab"

# switch panes with ctrl+hjkl without prefix, aware of vim splits, as vim-tmux-navigator in tmux
# (needs the plugin in .config/herdr/plugins/vim-navigator, linked with `herdr plugin link`,
# and the <C-hjkl> mappings in .config/nvim/lua/config/remap.lua)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "tomas.vim-navigator.left"
description = "pane or vim split left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "tomas.vim-navigator.down"
description = "pane or vim split down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "tomas.vim-navigator.up"
description = "pane or vim split up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "tomas.vim-navigator.right"
description = "pane or vim split right"

[ui]
status_indicators = "dots"

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"
