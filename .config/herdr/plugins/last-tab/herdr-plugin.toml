id = "tomas.last-tab"
name = "Last tab"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Go back to the previously focused tab, as tmux last-window"
platforms = ["linux", "macos"]

# start the watcher that records every tab change (see watch.sh)
[[startup]]
command = ["sh", "start.sh"]

# focus the previous tab (bound to prefix+l in config.toml)
[[actions]]
id = "last-tab"
title = "Last tab"
contexts = ["workspace"]
command = ["sh", "last.sh"]
